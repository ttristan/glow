# Local-only database foundation; game services will be added when implemented.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: glow
      POSTGRES_USER: glow
      POSTGRES_PASSWORD: glow-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - glow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glow -d glow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  glow_pgdata:
